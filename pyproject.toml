[project]
name = "osiris-pandas"
version = "0.4.0"
description = "Typed pandas bindings for Osiris, with localized names and declared call contracts."
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.26"]

[build-system]
build-backend = "osiris_build"
requires = ["osiris-lang>=0.3.18,<0.4"]


