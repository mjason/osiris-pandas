name: release

# Publishes on a version tag. Trusted Publishing exchanges the workflow's OIDC
# identity for a short-lived PyPI token, so no secret is stored in the repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # osiris_build requires the build interpreter to match targetPython, and a
      # library is built at the oldest version it supports.
      - run: uv python install 3.11
      - run: uv build
      - run: |
          test -f dist/*.whl
          uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
